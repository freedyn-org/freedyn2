name: Wheels

# Wheels for Windows and Linux (pip install / uv tool install freedyn2): the Python package with
# the compiled runtime and its KLU libraries (pyproject.toml: scikit-build-core, cibuildwheel).
# Runs for pull requests that change the packaging, by hand, and for version tags; a version tag
# (v0.1.0, ...) also publishes to PyPI (trusted publishing: the PyPI project must have this
# repository and workflow registered as a trusted publisher, environment "pypi").
on:
  pull_request:
    paths: [pyproject.toml, CMakeLists.txt, tools/**, .github/workflows/wheels.yml]
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4  # the dependencies of the Windows build (on Linux they are built in the container)
        if: runner.os == 'Windows'
        with:
          path: C:/fd-deps
          key: wheel-deps-${{ runner.os }}-${{ hashFiles('tools/build_deps.py') }}
      - uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
