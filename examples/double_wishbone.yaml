# A double-wishbone front suspension (left) on a rig, built from hardpoints: the chassis is
# the ground, the wheel is pushed by a tire spring on a road with a bump. Move a hardpoint in
# the viewer (hardpoints, click one, tune) and every joint, spring and frame using it follows.
model: double_wishbone
gravity: [0, 0, -9.81]

parameters:
  z_uca: 0.55          # [m] height of the upper control arm pivot axis
  k_spring: 60000.0    # [N/m]
  c_damper: 3500.0     # [N s/m]
  k_tire: 250000.0     # [N/m]
  F_wheel: 4000.0      # [N] static wheel load
  h: 0.03              # [m] bump height
  t0: 0.3              # [s] bump start
  dt: 0.06             # [s] bump duration

# x forward, y to the left, z up; global at t = 0
points:
  uca_front: [0.15, 0.40, =z_uca]
  uca_rear: [-0.15, 0.40, =z_uca]
  uca_outer: [0.0, 0.68, 0.52]
  lca_front: [0.20, 0.35, 0.18]
  lca_rear: [-0.20, 0.35, 0.18]
  lca_outer: [0.0, 0.72, 0.13]
  tie_inner: [-0.12, 0.38, 0.25]
  tie_outer: [-0.12, 0.70, 0.25]
  wheel_center: [0.0, 0.78, 0.30]
  spring_top: [0.0, 0.52, 0.75]
  spring_bottom: {from: lca_outer, offset: [0.0, -0.10, 0.05]}

frames:
  uca_axis: {origin: uca_front, z: [uca_rear, uca_front]}
  lca_axis: {origin: lca_front, z: [lca_rear, lca_front]}
  wheel_axis: {origin: wheel_center, z: [0, 1, 0]}

bodies:
  uca:
    mass: 2.0
    inertia: [0.02, 0.01, 0.02]
    position: [0.0, 0.52, 0.54]
    shapes: [{type: box, size: [0.30, 0.28, 0.025], position: [0.0, 0.54, 0.54]}]
  lca:
    mass: 3.5
    inertia: [0.04, 0.02, 0.05]
    position: [0.0, 0.50, 0.16]
    shapes: [{type: box, size: [0.40, 0.37, 0.03], position: [0.0, 0.535, 0.155]}]
  carrier:
    mass: 8.0
    inertia: [0.08, 0.06, 0.05]
    position: [0.0, 0.71, 0.32]
    shapes: [{type: box, size: [0.06, 0.06, 0.42], position: [0.0, 0.71, 0.33]}]
  tie_rod:
    mass: 0.6
    inertia: [0.005, 0.0005, 0.005]
    position: [-0.12, 0.54, 0.25]
    shapes: [{type: cylinder, radius: 0.012, length: 0.32, orientation: [0.7071068, -0.7071068, 0, 0]}]
  wheel:
    mass: 18.0
    inertia: [0.6, 1.0, 0.6]
    position: wheel_center
    shapes: [{type: cylinder, radius: 0.3, length: 0.2, orientation: [0.7071068, -0.7071068, 0, 0], color: "#343a40"}]

joints:
  uca_pivot: {type: revolute, body1: uca, location: uca_axis, orientation: uca_axis}
  lca_pivot: {type: revolute, body1: lca, location: lca_axis, orientation: lca_axis}
  upper_ball: {type: spherical, body1: carrier, body2: uca, location: uca_outer}
  lower_ball: {type: spherical, body1: carrier, body2: lca, location: lca_outer}
  tie_rod_inner: {type: spherical, body1: tie_rod, location: tie_inner}
  tie_rod_outer: {type: spherical, body1: tie_rod, body2: carrier, location: tie_outer}
  hub: {type: revolute, body1: wheel, body2: carrier, location: wheel_axis, orientation: wheel_axis}

forces:
  spring:
    type: spring_damper
    body1: lca
    point1: spring_bottom
    point2: spring_top
    stiffness: =k_spring
    damping: =c_damper
    preload: =-1.3 * F_wheel     # compression; holds the static wheel load (lever ratio, unsprung mass)
  tire:
    type: expression_force
    body1: wheel
    direction: [0, 0, 1]
    force: F_wheel + k_tire * (if_else((t > t0) * (t < t0 + dt), 0.5 * h * (1 - cos(2 * pi * (t - t0) / dt)), 0) - z_wheel)

measures:
  z_wheel: {type: displacement, body1: wheel, component: z, offset: initial}

sensors:
  wheel_center: {body1: carrier, point: wheel_center}

solver: {type: HHT, alpha: -0.1, end_time: 1.0, step: 0.001, output_step: 0.005}
